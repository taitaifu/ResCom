name: ResCom
channels:
  - defaults

dependencies:
  - python=3.12
  - pip
  - setuptools
  - wheel
  - pip:
      # PyTorch CUDA 12.8
      - --index-url https://pypi.org/simple
      - --extra-index-url https://download.pytorch.org/whl/cu128

      # Core numeric/data stack
      - numpy==2.2.6
      - pandas==2.2.3
      - scipy==1.15.2
      - joblib==1.4.2

      # Model training/inference stack
      - torch==2.7.1+cu128
      - torchvision==0.22.1+cu128
      - torchaudio==2.7.1+cu128

      - tensorboard==2.19.0
      - tqdm==4.67.1
      - optuna==4.2.1

      # Visualization
      - matplotlib==3.10.1
